<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Today Show Recipe Corner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header"><h1>Today Show Recipe Corner</h1><p class="tagline">Fast, friendly recipes for busy mornings</p></header>
  <main class="content">
    <section class="filters" aria-label="filters">
      <input id="q" type="text" placeholder="Search recipes..." />
      <button id="clear">Clear</button>
    </section>
    <section class="gallery" id="gallery" aria-label="recipe-gallery"></section>
  </main>
  <footer class="site-footer">Copyright Today Show Recipe Corner</footer>
  <script src="script.js"></script>
</body>
</html>
